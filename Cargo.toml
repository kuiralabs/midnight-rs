[workspace]
resolver = "2"
members = [
    "crates/midnight-contract",
    "crates/midnight-provider",
    "crates/midnight-indexer-client",
    "crates/midnight-core",
    "crates/midnight-crypto",
    "crates/midnight-private-state",
    "crates/midnight-wallet",
    "crates/midnight-wallet-facade",
    "crates/midnight-types",
    "crates/midnight-helpers",
    "crates/compact/codegen",
    "crates/compact/analyzed-ir",
    "crates/compact/interpreter",
    "crates/compact/bindgen",
    "crates/compact/bindgen-macro",
    "crates/midnight-typed-state",
    "crates/compact/runtime",
    "examples/*",
    "tests/integration",
    "tests/conformance",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates
midnight-indexer-client = { path = "crates/midnight-indexer-client" }
midnight-provider = { path = "crates/midnight-provider" }
midnight-contract = { path = "crates/midnight-contract" }
midnight-core = { path = "crates/midnight-core" }
midnight-crypto = { path = "crates/midnight-crypto" }
midnight-private-state = { path = "crates/midnight-private-state" }
midnight-wallet = { path = "crates/midnight-wallet" }
midnight-wallet-facade = { path = "crates/midnight-wallet-facade" }
midnight-types = { path = "crates/midnight-types" }
midnight-helpers = { path = "crates/midnight-helpers" }

# Compact (code generation for Compact smart contracts)
compact-codegen = { path = "crates/compact/codegen" }
compact-analyzed-ir = { path = "crates/compact/analyzed-ir" }
compact-interpreter = { path = "crates/compact/interpreter" }
compact-bindgen = { path = "crates/compact/bindgen" }
compact-bindgen-macro = { path = "crates/compact/bindgen-macro" }
midnight-typed-state = { path = "crates/midnight-typed-state" }
compact-runtime = { path = "crates/compact/runtime" }

# External
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
sha2 = "0.10"
sha3 = "0.11"
hex = "0.4"
# H256: the block-hash type, the same crate subxt re-exports it from.
primitive-types = "0.13"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
# Mirrors subxt 0.50's default feature set (jsonrpsee, native), made explicit
# to guard against upstream default drift, plus the auto-reconnecting websocket
# client the provider's node connection is built on. Re-derive the default part
# of this list from upstream's defaults on every subxt version bump: with
# default-features off, a new default feature an upgrade relies on would
# otherwise be dropped silently.
subxt = { version = "0.50", default-features = false, features = ["jsonrpsee", "native", "reconnecting-rpc-client"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
tempfile = "3"
trybuild = "1"
bip32 = "0.5"
bip39 = { version = "2.2.2", features = ["rand"] }
zeroize = { version = "1", features = ["derive"] }

# midnight-ledger ecosystem: ledger 8 and ledger 9 link side by side.
#
# This is the beta core: its ledger 9 generation is the set that stagenet
# runs, `ledger-9.1.0.0-rc.3` (npm ledger-v9 1.0.0-rc.3, midnight-node
# 2.0.0-rc.4, whose tree is the stagenet node's 2.0.0-d9729c13). Stagenet
# verifies a Dust spend only against that set's circuit, which rc.5 changed.
#
# The ledger 9 crates come from upstream's per-crate rc.3 release tags, the
# tags midnight-node 2.0.0-rc.4 takes them from. Their sources equal the
# `ledger-9.1.0.0-rc.3` tree; their manifests name siblings by crates.io
# version, so the `[patch.crates-io]` table at the end of this manifest points
# each sibling at its tag.
#
# Ledger 8 (8.1.2) and the midnight-node helpers come from the same RomarQ
# fork revisions as the Release 1 core. Those revisions name the ledger 9 and
# shared crates by the fork's ledger 9 revision (rc.5), so the
# `[patch."https://github.com/RomarQ/midnight-ledger"]` table moves them to
# the same rc.3 tags.
#
# The two generations share the crates listed under "Shared": a single
# instance serves both, so `AlignedValue`, `HashOutput`, `Sp` and the tagged
# codec are one Rust type across them. Every shared crate is the rc.3 one
# except storage and storage-core: ledger 8.1.2 needs storage 2.0.3 or later,
# and rc.3 ships 2.0.1, so both generations take storage 2.0.4 and
# storage-core 1.2.2, as the Release 1 core does (midnight-node ran rc.3 on a
# newer storage 2.0.x the same way).
#
# zkir-v3 is not part of the rc.3 set: the rc.3 ledger does not link it. The
# provider and the Compact runtime take it from the fork's ledger 9 revision,
# as the Release 1 core does.
#
# Pinning policy: every ledger crate below is pinned with `=` because they
# ship as one ABI-coupled release set (serialization formats and proof
# artifacts must match across the group). Bump them together, deliberately.
# A pin must equal the version the patch tables supply, or Cargo keeps a
# second copy next to the patched one. Transitive midnight-* crates outside
# the ledger repository (proofs, zk-stdlib, ...) still float on upstream
# caret requirements and are held only by Cargo.lock.
#
# The Compact side (interpreter, runtime, typed state, generated bindings)
# binds to ledger 9's on-chain runtime. The Impact ops and the state encoding
# are the same in both generations, so its values reach a ledger 8 chain by
# re-encoding.
midnight-onchain-runtime = { version = "=4.0.0" }
midnight-onchain-state = { version = "=4.0.0" }
midnight-transient-crypto = { version = "=3.0.0" }
midnight-coin-structure = { version = "=3.0.0" }
midnight-curves = { version = "=0.3.1" }
# Pinned with midnight-curves: its `CircuitField` impls are on those types.
midnight-circuits = { version = "=7.2.4" }
midnight-zkir-v3 = { version = "=3.1.0-rc.1", git = "https://github.com/RomarQ/midnight-ledger", rev = "425ef0c2f48fcbd188ee8324550b388e13160795" }
# Ledger 8's state types, to read state a ledger 8 chain wrote.
midnight-onchain-state-ledger-8 = { package = "midnight-onchain-state", version = "=3.0.1", git = "https://github.com/RomarQ/midnight-ledger", rev = "22f4651449e671e9f0fc2602be0109ec3a2b990f" }
midnight-coin-structure-ledger-8 = { package = "midnight-coin-structure", version = "=2.0.2", git = "https://github.com/RomarQ/midnight-ledger", rev = "22f4651449e671e9f0fc2602be0109ec3a2b990f" }
# Shared
midnight-serialize = { version = "=1.2.0" }
midnight-base-crypto = { version = "=1.1.0" }
midnight-storage = { version = "=2.0.4" }

# The ledger helpers of midnight-node: `midnight-ledger-unsafe-helpers` carries
# the per-generation type surface and the transaction and wallet builders, in a
# `ledger_8` and a `ledger_9` module. It comes from the RomarQ/midnight-node
# fork's rq/midnight-rs-toolkit-2.1.0-rc.3 branch, which is `toolkit-2.1.0-rc.3`
# with its ledger crates taken from the fork revisions; the patch tables below
# move its ledger 9 crates to rc.3.
midnight-ledger-unsafe-helpers = { git = "https://github.com/RomarQ/midnight-node", rev = "ef1330ebbc9f7b7f7f3f3210a91bef2422b0d74f" }

# The rc.3 set, one entry per crate, each at the per-crate release tag that
# midnight-node 2.0.0-rc.4 takes it from. The `-old` key supplies the 2.x
# `transient-crypto` that ledger 8 and the ledger 9 crates' legacy keys use.
[patch.crates-io]
midnight-ledger-v9 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.3" }
midnight-ledger-static = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.3" }
midnight-zswap = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zswap-9.0.0-rc.3" }
midnight-coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "coin-structure-3.0.0-rc.1" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-1.1.0-rc.2" }
midnight-base-crypto-derive = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-derive-1.1.0-rc.2" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-3.0.0-rc.2" }
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }
midnight-onchain-vm = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-vm-4.0.0-rc.2" }
midnight-onchain-state = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-state-4.0.0-rc.3" }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-runtime-4.0.0-rc.2" }
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-2.2.0-rc.3" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "serialize-1.2.0-rc.1" }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-2.0.4-rc.1" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-core-1.2.2-rc.1" }

# The same tags for the crates that the RomarQ fork revisions name by the
# fork's ledger 9 revision.
[patch."https://github.com/RomarQ/midnight-ledger"]
midnight-ledger-v9 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.3" }
midnight-zswap = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zswap-9.0.0-rc.3" }
midnight-coin-structure = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "coin-structure-3.0.0-rc.1" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-1.1.0-rc.2" }
midnight-base-crypto-derive = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-derive-1.1.0-rc.2" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-3.0.0-rc.2" }
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }
midnight-onchain-vm = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-vm-4.0.0-rc.2" }
midnight-onchain-state = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-state-4.0.0-rc.3" }
midnight-onchain-runtime = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-runtime-4.0.0-rc.2" }
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-2.2.0-rc.3" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "serialize-1.2.0-rc.1" }
midnight-storage = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-2.0.4-rc.1" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-core-1.2.2-rc.1" }
